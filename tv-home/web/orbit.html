<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="orbit.css">
<link rel="stylesheet" href="orbit-apps.css">
<link rel="stylesheet" href="cine.css">
<link rel="stylesheet" href="cine-skin.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="top">
  <div class="brand"><img src="orbit-logo.png" alt="orbit"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="avatar" id="avatar" role="button" aria-label="Who is watching"></div>
</header>

<main>
  <!-- For You -->
  <section class="page" id="page-foryou">
    <div class="hero" id="hero">
      <div class="hero-art" id="hero-art"></div>
      <div class="hero-text">
        <p class="hero-kicker" id="hero-kicker"></p>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-sub" id="hero-sub"></p>
        <div class="hero-btns" id="hero-btns"></div>
      </div>
    </div>
    <h2 class="row-title" id="cw-title">Continue Watching</h2>
    <div class="cards" id="cards"></div>
    <div class="score-pill" id="score-pill" role="button"></div>
  </section>

  <!-- Apps (orbit-apps.js and orbit-apps.css) -->
  <section class="page" id="page-apps">
    <div class="apps-head">
      <h2 class="apps-title">Apps <span class="apps-count" id="apps-count"></span></h2>
      <p class="apps-hint" id="apps-hint">Hold OK to move an app</p>
    </div>
    <div class="apps-view" id="apps-view">
      <div class="app-grid" id="app-grid"></div>
    </div>
  </section>

  <!-- Live: the household's own TV line (orbit-tv.js) -->
  <section class="page" id="page-tv">
    <div class="tv-modes" id="tv-modes"></div>
    <div class="tv-wrap">
      <aside class="tv-cats" id="tv-cats"></aside>
      <div class="tv-list" id="tv-list"></div>
    </div>
    <div class="tv-eps" id="tv-eps"></div>
  </section>

  <!-- Sports hub -->
  <section class="page" id="page-scores">
    <div class="sp-head">
      <h1 class="sp-title">Sports</h1>
      <div class="sp-filters" id="sp-filters"></div>
    </div>
    <div class="sp-strip" id="sp-strip"></div>
    <div class="sp-main">
      <div class="sp-hero" id="sp-hero"></div>
      <aside class="sp-side" id="sp-side"></aside>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="orbit-apps.js"></script>
<script src="orbit-tv.js"></script>
<script src="orbit.js"></script>
</body>
</html>
