<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="orbit.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="top">
  <div class="brand"><img src="orbit-logo.png" alt="orbit"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="avatar" id="avatar" role="button" aria-label="Who is watching"></div>
</header>

<main>
  <!-- For You -->
  <section class="page" id="page-foryou">
    <div class="hero" id="hero">
      <div class="hero-art" id="hero-art"></div>
      <div class="hero-text">
        <p class="hero-kicker" id="hero-kicker"></p>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-sub" id="hero-sub"></p>
        <div class="hero-btns" id="hero-btns"></div>
      </div>
    </div>
    <h2 class="row-title" id="cw-title">Continue Watching</h2>
    <div class="cards" id="cards"></div>
    <div class="score-pill" id="score-pill" role="button"></div>
  </section>

  <!-- Apps -->
  <section class="page" id="page-apps">
    <div class="app-grid" id="app-grid"></div>
  </section>

  <!-- Scores -->
  <section class="page" id="page-scores">
    <div class="board" id="board"></div>
  </section>
</main>

<script src="config.js"></script>
<script src="orbit.js"></script>
</body>
</html>
