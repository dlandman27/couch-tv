<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="orbit.css">
<link rel="stylesheet" href="orbit-apps.css">
<link rel="stylesheet" href="cine.css">
<link rel="stylesheet" href="cine-skin.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="top">
  <div class="brand"><img src="orbit-logo.png" alt="orbit"></div>
  <!-- the glass nav: tab pills with a sliding glow, a divider, then the icon buttons (orbit.js fills it) -->
  <nav class="cj-nav" id="nav" role="tablist">
    <div class="nav-pill" id="nav-pill" aria-hidden="true"></div>
    <div class="nav-items" id="nav-tabs"></div>
    <span class="nav-divider" aria-hidden="true"></span>
    <div class="nav-items" id="nav-icons"></div>
  </nav>
  <div class="avatar" id="avatar" role="button" aria-label="Who is watching"></div>
</header>

<main>
  <!-- Home: the hero carousel, providers and rails (orbit-home.js) -->
  <section class="page" id="page-home">
    <div class="hc" id="hc"></div>
    <h2 class="row-title" id="home-prov-title">Browse by Provider</h2>
    <div class="prov-row" id="home-prov"></div>
    <div class="home-rows" id="home-rows"></div>
    <div class="score-pill" id="score-pill" role="button"></div>
  </section>

  <!-- Apps (orbit-apps.js and orbit-apps.css) -->
  <section class="page" id="page-apps">
    <div class="apps-head">
      <h2 class="apps-title">Apps <span class="apps-count" id="apps-count"></span></h2>
      <div class="apps-tools">
        <p class="apps-hint" id="apps-hint">Hold OK to move an app</p>
        <span class="apps-sort" id="apps-sort" role="button">Custom</span>
      </div>
    </div>
    <div class="apps-view" id="apps-view">
      <div class="app-grid" id="app-grid"></div>
    </div>
  </section>

  <!-- Movies, Shows and Live TV share this page; the header tab picks the catalogue (orbit-tv.js) -->
  <section class="page" id="page-tv">
    <div class="tv-wrap">
      <aside class="tv-cats" id="tv-cats"></aside>
      <div class="tv-list" id="tv-list"></div>
    </div>
  </section>

  <!-- Sports hub -->
  <section class="page" id="page-scores">
    <div class="sp-head">
      <h1 class="sp-title">Sports</h1>
      <div class="sp-filters" id="sp-filters"></div>
    </div>
    <div class="sp-strip" id="sp-strip"></div>
    <div class="sp-main">
      <div class="sp-hero" id="sp-hero"></div>
      <aside class="sp-side" id="sp-side"></aside>
    </div>
  </section>
</main>

<!-- a series' seasons and episodes, over whichever page opened it -->
<div class="tv-eps" id="tv-eps"></div>

<script src="config.js"></script>
<script src="orbit-apps.js"></script>
<script src="orbit-tv.js"></script>
<script src="orbit-home.js"></script>
<script src="orbit.js"></script>
</body>
</html>
